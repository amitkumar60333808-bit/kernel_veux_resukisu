name: Build ReSukiSU Kernel (AOSP clang-r487747c)
# Uses exact AOSP clang-r487747c (build 10087095) + full stock vendor config
# + ReSukiSU (complete manual hooks) + SUSFS (SUS_SU disabled).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-build.yml'

jobs:
  build-kernel:
    name: Build ReSukiSU Kernel (ZyC-Clang 16)
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6375.git kernel

      - name: Download AOSP clang-r487747c (exact crDroid toolchain)
        run: |
          echo "=== Downloading AOSP clang-r487747c (build 10087095, same as stock) ==="
          mkdir -p /tmp/toolchain
          curl -sL --max-time 570 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/fd582b924a40/clang-r487747c.tar.gz" -o /tmp/clang.tar.gz
          ls -la /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C /tmp/toolchain 2>&1 | tail -2 || true
          echo "=== Verify toolchain ==="
          /tmp/toolchain/bin/clang-17 --version | head -3
          ls /tmp/toolchain/bin/ | grep -cE "llvm-(ar|nm|objcopy|strip)$"
          echo "/tmp/toolchain/bin" >> $GITHUB_PATH
          echo "TOOLCHAIN_DIR=/tmp/toolchain" >> $GITHUB_ENV

      - name: Setup ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply SUSFS patches
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/apply_susfs.py" -o apply_susfs.py
          python3 apply_susfs.py

      - name: Apply manual hooks and fixes
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/patch_hooks.py" -o patch_hooks.py
          python3 patch_hooks.py

      - name: Configure kernel
        run: |
          cd kernel
          echo "=== Using FULL stock vendor config (1868 =y) + KSU/SUSFS ==="
          mkdir -p out
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/vendor_config.txt" -o out/.config
          echo "Base configs: $(grep -c '=y' out/.config) =y, $(grep -c '=m' out/.config) =m"
          if [ -f arch/arm64/configs/vendor/susfs_fragment.config ]; then
            cat arch/arm64/configs/vendor/susfs_fragment.config >> out/.config
            echo "  Added SUSFS config fragment"
          fi
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_LOCALVERSION=-ReSukiSU-veux" >> out/.config
          echo "=== Resolve deps (pass 1) ==="
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out olddefconfig
          echo "=== Verify critical configs ==="
          grep -E "^CONFIG_QCOM_SCM=|^CONFIG_QCOM_KGSL=|^CONFIG_SYNC_FILE=|^CONFIG_SECURITY_SELINUX=|^CONFIG_KSU=|^CONFIG_DRM=" out/.config || echo "WARN: some configs missing"
          echo "=== Build scripts/prepare ==="
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out prepare -j$(nproc)
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out scripts -j$(nproc)
          echo "=== Generate flask.h if needed (SELinux) ==="
          grep -q "^CONFIG_SECURITY_SELINUX=y" out/.config && \
            mkdir -p scripts/selinux/genheaders out/scripts/selinux/genheaders out/security/selinux && \
            (gcc -Iinclude/uapi -Iinclude -Isecurity/selinux/include \
               -o out/scripts/selinux/genheaders/genheaders \
               scripts/selinux/genheaders/genheaders.c > /tmp/gcc.log 2>&1 && \
              out/scripts/selinux/genheaders/genheaders \
                security/selinux/include/flask.h security/selinux/include/av_permissions.h && \
              cp security/selinux/include/flask.h security/selinux/flask.h && \
              cp security/selinux/include/av_permissions.h security/selinux/av_permissions.h && \
              cp security/selinux/include/flask.h out/security/selinux/flask.h && \
              cp security/selinux/include/av_permissions.h out/security/selinux/av_permissions.h && \
              echo "flask.h generated") || \
            echo "flask.h generation skipped (SELINUX not enabled or gcc failed)"

      - name: Build kernel
        run: |
          cd kernel
          echo "=== Compiler ==="
          clang --version | head -3
          set +e
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out KCFLAGS="-w" -j$(nproc) 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -iE "error:" build.log | grep -v "warning:" | tail -20
            echo "=== LAST 30 LINES ==="
            tail -30 build.log
          fi
          exit $BUILD_RC

      - name: Show build errors
        if: failure()
        run: |
          cd kernel
          grep -iE "error:" build.log | grep -v "warning:" | tail -20

      - name: Check output
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/Image* 2>/dev/null || echo "Image NOT found"

      - name: Package AnyKernel3
        if: success()
        run: |
          cd kernel
          IMAGE=$(ls out/arch/arm64/boot/Image* 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No Image found"
            exit 1
          fi
          echo "Found kernel image: $IMAGE"
          echo "Image size: $(wc -c < $IMAGE)"
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.zip
          cp ../kernel/$IMAGE Image
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU-veux/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../ReSukiSU-veux.zip . -x ".git*"

      - name: Upload artifact
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kernel-veux
          path: ReSukiSU-veux.zip
          retention-days: 7
