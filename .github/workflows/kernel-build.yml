name: Build ReSukiSU Kernel for veux (SM6375)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-build.yml'

jobs:
  build-kernel:
    name: Build ReSukiSU Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3 lld llvm

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6375.git kernel

      - name: Setup ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply SUSFS patches
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/apply_susfs.py" -o apply_susfs.py
          python3 apply_susfs.py

      - name: Apply manual hooks
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/patch_hooks.py" -o patch_hooks.py
          python3 patch_hooks.py

      - name: Configure kernel
        run: |
          cd kernel
          echo "=== Available configs ==="
          ls arch/arm64/configs/
          ls arch/arm64/configs/vendor/ | grep -i holi
          make ARCH=arm64 LLVM=1 O=out defconfig
          cat arch/arm64/configs/vendor/holi_QGKI.config >> out/.config
          if [ -f arch/arm64/configs/vendor/susfs_fragment.config ]; then
            cat arch/arm64/configs/vendor/susfs_fragment.config >> out/.config
            echo "  Added SUSFS config fragment"
          fi
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_LOCALVERSION=-ReSukiSU-veux" >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          echo "# CONFIG_QCOM_GCC_QCS404 is not set" >> out/.config
          echo "# CONFIG_QRTR_TUN is not set" >> out/.config
          echo "# CONFIG_QCOM_SCM is not set" >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          make ARCH=arm64 LLVM=1 O=out prepare -j$(nproc)
          make ARCH=arm64 LLVM=1 O=out scripts -j$(nproc)
          make ARCH=arm64 LLVM=1 O=out security/selinux/ -j$(nproc) 2>&1 | tail -5 || true
          cp -v out/security/selinux/flask.h security/selinux/flask.h 2>/dev/null || true
          cp -v out/security/selinux/av_permissions.h security/selinux/av_permissions.h 2>/dev/null || true
          ls -la security/selinux/flask.h 2>/dev/null || echo "WARN: flask.h still missing"

      - name: Build kernel
        run: |
          cd kernel
          set +e
          make ARCH=arm64 LLVM=1 O=out KCFLAGS="-w" -j$(nproc) 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -iE "error:" build.log | grep -v "warning:" | tail -20
            echo "=== LAST 30 LINES ==="
            tail -30 build.log
          fi
          exit $BUILD_RC

      - name: Show build errors
        if: failure()
        run: |
          cd kernel
          grep -iE "error:" build.log | grep -v "warning:" | tail -20

      - name: Check output
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/Image* 2>/dev/null || echo "Image NOT found"

      - name: Package AnyKernel3
        if: success()
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          IMAGE=$(ls out/arch/arm64/boot/Image* 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No Image found in out/arch/arm64/boot/"
            exit 1
          fi
          echo "Found kernel image: $IMAGE"
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.zip
          cp ../kernel/$IMAGE Image
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU-veux/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../ReSukiSU-veux.zip . -x ".git*"

      - name: Upload artifact
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kernel-veux
          path: ReSukiSU-veux.zip
          retention-days: 7

      - name: Create Release
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ReSukiSU-veux.zip
          tag_name: v1.1
          name: ReSukiSU Kernel for veux
          body: |
            ReSukiSU kernel for Redmi Note 11 Pro+ 5G (veux/SM6375)
            - crDroid 14.0 kernel base (5.4.280)
            - KernelSU root + SUSFS
            - Pure LLVM build
            
            Flash: Extract boot.img, fastboot flash boot boot.img
            Recovery: fastboot flash boot stock_boot.img
          make_latest: true
