name: Build ReSukiSU Kernel (AOSP Clang r487747c)
# Uses same clang-r487747c as stock kernel + full stock config + ReSukiSU/SUSFS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-build.yml'

jobs:
  build-kernel:
    name: Build ReSukiSU Kernel (AOSP Clang)
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3 xz-utils zstd

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6375.git kernel

      - name: Download AOSP clang-r487747c toolchain
        run: |
          echo "=== Downloading AOSP clang-r487747c via sparse checkout ==="
          git clone --depth=1 --filter=blob:none --sparse https://github.com/msft-mirror-aosp/platform.prebuilts.clang.host.linux-x86.git /tmp/clang-host 2>&1 | tail -5
          cd /tmp/clang-host
          git sparse-checkout set clang-r487747c 2>&1 | tail -5
          ls -la /tmp/clang-host/clang-r487747c/bin/clang
          /tmp/clang-host/clang-r487747c/bin/clang --version | head -3
          echo "CLANG_DIR=/tmp/clang-host/clang-r487747c" >> $GITHUB_ENV
          echo "/tmp/clang-host/clang-r487747c/bin" >> $GITHUB_PATH

      - name: Setup ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply SUSFS patches
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/apply_susfs.py" -o apply_susfs.py
          python3 apply_susfs.py

      - name: Apply manual hooks and fixes
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/patch_hooks.py" -o patch_hooks.py
          python3 patch_hooks.py

      - name: Configure kernel
        run: |
          cd kernel
          echo "=== Using full stock vendor config as base ==="
          mkdir -p out
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/vendor_config.txt" -o out/.config
          echo "Stock configs: $(grep -c '=y' out/.config) =y, $(grep -c '=m' out/.config) =m"
          if [ -f arch/arm64/configs/vendor/susfs_fragment.config ]; then
            cat arch/arm64/configs/vendor/susfs_fragment.config >> out/.config
            echo "  Added SUSFS config fragment"
          fi
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_LOCALVERSION=-ReSukiSU-veux" >> out/.config
          echo "=== Resolve deps ==="
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- O=out olddefconfig
          echo "=== Verify critical configs ==="
          grep -E "^CONFIG_QCOM_SCM=|^CONFIG_QCOM_KGSL=|^CONFIG_SYNC_FILE=|^CONFIG_SECURITY_SELINUX=|^CONFIG_KSU=|^CONFIG_DRM=" out/.config || echo "WARN: some configs missing"
          echo "=== Build scripts/prepare ==="
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- O=out prepare -j$(nproc)
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- O=out scripts -j$(nproc)

      - name: Build kernel
        run: |
          cd kernel
          echo "=== Using compiler ==="
          echo "PATH=$PATH" | head -1
          which clang && clang --version | head -3
          set +e
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- O=out KCFLAGS="-w" -j$(nproc) 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -iE "error:" build.log | grep -v "warning:" | tail -20
            echo "=== LAST 30 LINES ==="
            tail -30 build.log
          fi
          exit $BUILD_RC

      - name: Show build errors
        if: failure()
        run: |
          cd kernel
          grep -iE "error:" build.log | grep -v "warning:" | tail -20

      - name: Check output
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/Image* 2>/dev/null || echo "Image NOT found"

      - name: Package AnyKernel3
        if: success()
        run: |
          cd kernel
          IMAGE=$(ls out/arch/arm64/boot/Image* 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No Image found"
            exit 1
          fi
          echo "Found kernel image: $IMAGE"
          echo "Image size: $(wc -c < $IMAGE)"
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.zip
          cp ../kernel/$IMAGE Image
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU-veux/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../ReSukiSU-veux.zip . -x ".git*"

      - name: Upload artifact
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kernel-veux
          path: ReSukiSU-veux.zip
          retention-days: 7
