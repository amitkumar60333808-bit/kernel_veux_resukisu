name: Build Test Kernel (stock config, no patches)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-build.yml'

jobs:
  build-kernel:
    name: Build Stock Test Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3 lld llvm

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6375.git kernel

      - name: NO patches - stock source only (test)
        run: |
          echo "=== BUILDING UNMODIFIED STOCK SOURCE ==="
          echo "No ReSukiSU, no SUSFS, no manual hooks"
          echo "Just stock config to verify our build system produces a bootable kernel"

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p out
          curl -LSs "https://raw.githubusercontent.com/amitkumar60333808-bit/kernel_veux_resukisu/main/vendor_config.txt" -o out/.config
          echo "Stock configs: $(grep -c '=y' out/.config) =y, $(grep -c '=m' out/.config) =m"
          echo "=== Resolve deps ==="
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          echo "=== Build scripts/prepare ==="
          make ARCH=arm64 LLVM=1 O=out prepare -j$(nproc)
          make ARCH=arm64 LLVM=1 O=out scripts -j$(nproc)

      - name: Build kernel
        run: |
          cd kernel
          set +e
          make ARCH=arm64 LLVM=1 O=out KCFLAGS="-w" -j$(nproc) 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -iE "error:" build.log | grep -v "warning:" | tail -20
            echo "=== LAST 30 LINES ==="
            tail -30 build.log
          fi
          exit $BUILD_RC

      - name: Check output
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/Image* 2>/dev/null || echo "Image NOT found"

      - name: Package AnyKernel3
        if: success()
        run: |
          cd kernel
          IMAGE=$(ls out/arch/arm64/boot/Image* 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No Image found"
            exit 1
          fi
          echo "Found kernel image: $IMAGE"
          echo "Image size: $(wc -c < $IMAGE)"
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.zip
          cp ../kernel/$IMAGE Image
          sed -i 's/kernel.string=.*/kernel.string=stock-test/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../stock-test-veux.zip . -x ".git*"

      - name: Upload artifact
        if: hashFiles('stock-test-veux.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stock-test-kernel-veux
          path: stock-test-veux.zip
          retention-days: 7
