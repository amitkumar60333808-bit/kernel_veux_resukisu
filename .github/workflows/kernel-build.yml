name: Build ReSukiSU Kernel (Nebula KSU + Display Fix)
# Uses dev-sm6375 kernel source (Nebula) with KernelSU built-in
# Forces display/DRM modules to built-in (=y) for vendor module compat

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kernel-build.yml'

jobs:
  build-kernel:
    name: Build ReSukiSU Kernel (Nebula KSU + Display Fix)
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

      - name: Clone kernel source (Nebula dev-sm6375, ksu branch)
        run: |
          echo "=== Cloning dev-sm6375/kernel_xiaomi_sm6375 (ksu branch) ==="
          git clone --depth=1 --branch ksu https://github.com/dev-sm6375/kernel_xiaomi_sm6375.git kernel

      - name: Disable ESD check in kernel source
        run: |
          cd kernel
          CONN_FILE="techpack/display/msm/sde/sde_connector.c"
          echo "=== Patching $CONN_FILE to disable ESD check ==="
          echo "Before:"
          grep -n "_sde_connector_report_panel_dead\|esd_err_irq_handle" "$CONN_FILE" | head -10

          echo "=== Patching _sde_connector_report_panel_dead ==="
          FUNC_LINE=$(grep -n "void _sde_connector_report_panel_dead" "$CONN_FILE" | head -1 | cut -d: -f1)
          echo "Function declaration at line $FUNC_LINE"
          BRACE_LINE=$(awk -v start=$FUNC_LINE 'NR>=start && /\{/{print NR; exit}' "$CONN_FILE")
          echo "Opening brace at line $BRACE_LINE"
          sed -i "${BRACE_LINE}a\\\\treturn;" "$CONN_FILE"
          echo "Inserted return; at line $((BRACE_LINE+1))"

          echo "=== Patching esd_err_irq_handle ==="
          IRQ_LINE=$(grep -n "static irqreturn_t esd_err_irq_handle" "$CONN_FILE" | head -1 | cut -d: -f1)
          echo "IRQ handler at line $IRQ_LINE"
          IRQ_BRACE=$(awk -v start=$IRQ_LINE 'NR>=start && /\{/{print NR; exit}' "$CONN_FILE")
          echo "Opening brace at line $IRQ_BRACE"
          sed -i "${IRQ_BRACE}a\\\\treturn IRQ_HANDLED;" "$CONN_FILE"
          echo "Inserted return IRQ_HANDLED; at line $((IRQ_BRACE+1))"

          echo "=== Verify ==="
          grep -n "_sde_connector_report_panel_dead\|esd_err_irq_handle\|return;" "$CONN_FILE" | head -20

      - name: Download AOSP clang-r487747c
        run: |
          echo "=== Downloading AOSP clang-r487747c ==="
          mkdir -p /tmp/toolchain
          curl -sL --max-time 570 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/fd582b924a40/clang-r487747c.tar.gz" -o /tmp/clang.tar.gz
          ls -la /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C /tmp/toolchain 2>&1 | tail -2 || true
          echo "=== Verify toolchain ==="
          /tmp/toolchain/bin/clang-17 --version | head -3
          ls /tmp/toolchain/bin/ | grep -cE "llvm-(ar|nm|objcopy|strip)$"
          echo "/tmp/toolchain/bin" >> $GITHUB_PATH
          echo "TOOLCHAIN_DIR=/tmp/toolchain" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          cd kernel
          echo "=== Using veux-qgki_defconfig (KSU built-in) ==="
          mkdir -p out
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out vendor/veux-qgki_defconfig

          echo "=== Forcing display/DRM/SND modules to built-in (=y) ==="
          sed -i 's/^\(CONFIG_DRM.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_SND.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_SND_SOC.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_SPI.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_I2C.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_USB.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_MMC.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_INPUT.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_HID.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_BT.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_CFG80211\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_MAC80211\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_WLAN.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_SC.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_FINGERPRINT.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_LEDS.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_REGULATOR.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_GPIO.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_PINCTRL.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_POWER.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_RTC.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_SENSORS.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_MEDIA.*\)=m$/\1=y/' out/.config
          sed -i 's/^\(CONFIG_VIDEO.*\)=m$/\1=y/' out/.config

          echo "=== Ensure KSU and display configs ==="
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_LOCALVERSION=-ReSukiSU-veux" >> out/.config

          echo "=== Resolve deps ==="
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out olddefconfig
          echo "Final: $(grep -c '=y' out/.config) =y, $(grep -c '=m' out/.config) =m"

          echo "=== Verify critical configs ==="
          grep -E "^CONFIG_KSU=|^CONFIG_DRM=|^CONFIG_DRM_MIPI_DSI=|^CONFIG_GKI_HIDDEN_DRM_CONFIGS=|^CONFIG_SECURITY_SELINUX=|^CONFIG_BLK_DEV_DM=" out/.config || echo "WARN: some configs missing"

      - name: Build kernel
        run: |
          cd kernel
          echo "=== Compiler ==="
          clang --version | head -3
          set +e
          make ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ O=out KCFLAGS="-w" -j$(nproc) 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -iE "error:" build.log | grep -v "warning:" | tail -30
            echo "=== LAST 30 LINES ==="
            tail -30 build.log
          fi
          exit $BUILD_RC

      - name: Show build errors
        if: failure()
        run: |
          cd kernel
          grep -iE "error:" build.log | grep -v "warning:" | tail -30

      - name: Check output
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/Image* 2>/dev/null || echo "Image NOT found"

      - name: Package AnyKernel3
        if: success()
        run: |
          cd kernel
          IMAGE=$(ls out/arch/arm64/boot/Image* 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No Image found"
            exit 1
          fi
          echo "Found kernel image: $IMAGE ($(wc -c < $IMAGE) bytes)"
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.zip
          cp ../kernel/$IMAGE Image
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU-veux/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../ReSukiSU-veux.zip . -x ".git*"

      - name: Upload artifact
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kernel-veux
          path: ReSukiSU-veux.zip
          retention-days: 7
