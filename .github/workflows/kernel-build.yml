name: Build ReSukiSU Kernel for veux (SM6375)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build ReSukiSU Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3 lld llvm

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6375.git kernel

      - name: Setup ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply manual hooks
        run: |
          cd kernel
          python3 << 'PYEOF'
          import re, sys

          def read_file(path):
              with open(path, 'r') as f:
                  return f.read()

          def write_file(path, content):
              with open(path, 'w') as f:
                  f.write(content)

          # ===== 1. fs/stat.c =====
          print("Patching fs/stat.c...")
          stat = read_file("fs/stat.c")

          stat_hook_decls = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  __attribute__((hot))
  extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
  				int *flags);

  extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
  #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
  extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);
  #endif
  #endif

  """

          stat_newfstatat_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  	ksu_handle_stat(&dfd, &filename, &flag);
  #endif
  """

          stat_newfstat_ret_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  	ksu_handle_newfstat_ret(&fd, &statbuf);
  #endif
  """

          stat_fstatat64_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK // 32-bit su
  	ksu_handle_stat(&dfd, &filename, &flag);
  #endif
  """

          stat_fstat64_ret_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK // for 32-bit
  	ksu_handle_fstat64_ret(&fd, &statbuf);
  #endif
  """

          # Add declarations before newfstatat SYSCALL
          if "ksu_handle_stat" not in stat:
              # Find the newfstatat SYSCALL and add declarations before it
              # Look for the pattern just before SYSCALL_DEFINE4(newfstatat
              marker = "SYSCALL_DEFINE4(newfstatat,"
              if marker in stat:
                  idx = stat.index(marker)
                  stat = stat[:idx] + stat_hook_decls + stat[idx:]
              else:
                  print("WARNING: Could not find SYSCALL_DEFINE4(newfstatat in stat.c")

          # Hook inside newfstatat - after "struct kstat stat; int error;"
          if "ksu_handle_stat(&dfd, &filename, &flag);" in stat:
              pass  # already applied
          else:
              # Find "struct kstat stat;\n\tint error;" inside newfstatat and add hook after
              pattern = "SYSCALL_DEFINE4(newfstatat,"
              idx = stat.index(pattern)
              # Find "int error;" after the SYSCALL_DEFINE4
              rest = stat[idx:]
              error_idx = rest.index("int error;")
              after_error = rest[error_idx + len("int error;"):error_idx + len("int error;") + 100]
              # Find the newline after int error; then the next statement
              stat = stat[:idx + error_idx + len("int error;")] + stat_newfstatat_hook + stat[idx + error_idx + len("int error;"):]

          # Hook newfstat return - find "return error" in newfstat context
          if "ksu_handle_newfstat_ret" not in stat:
              # Find SYSCALL_DEFINE2(newfstat and hook before return
              marker = "SYSCALL_DEFINE2(newfstat,"
              if marker in stat:
                  idx = stat.index(marker)
                  rest = stat[idx:]
                  # Find "return error;" 
                  ret_idx = rest.rindex("return error;")
                  insert_pos = idx + ret_idx
                  stat = stat[:insert_pos] + stat_newfstat_ret_hook + stat[insert_pos:]

          # Hook fstatat64 (if exists for 32-bit)
          if "fstatat64" in stat and "ksu_handle_stat(&dfd, &filename, &flag);" not in stat[stat.index("fstatat64") if "fstatat64" in stat else 0:]:
              marker = "SYSCALL_DEFINE4(fstatat64,"
              if marker in stat:
                  idx = stat.index(marker)
                  rest = stat[idx:]
                  error_idx = rest.index("int error;")
                  insert_pos = idx + error_idx + len("int error;")
                  stat = stat[:insert_pos] + stat_fstatat64_hook + stat[insert_pos:]

          # Hook fstat64 return (if exists)
          if "fstat64" in stat and "ksu_handle_fstat64_ret" not in stat:
              marker = "SYSCALL_DEFINE2(fstat64,"
              if marker in stat:
                  idx = stat.index(marker)
                  rest = stat[idx:]
                  ret_idx = rest.rindex("return error;")
                  insert_pos = idx + ret_idx
                  stat = stat[:insert_pos] + stat_fstat64_ret_hook + stat[insert_pos:]

          write_file("fs/stat.c", stat)
          print("  fs/stat.c patched OK")

          # ===== 2. fs/exec.c (kernel 3.14+ -> use ksu_handle_execveat + do_execveat_common) =====
          print("Patching fs/exec.c...")
          exec_c = read_file("fs/exec.c")

          exec_declare = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  __attribute__((hot))
  extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
  				void *argv, void *envp, int *flags);
  #endif

  """

          exec_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  	ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
  #endif
  """

          if "ksu_handle_execveat" not in exec_c:
              # Find do_execveat_common function and add hook inside
              marker = "static int do_execveat_common(int fd, struct filename *filename,"
              if marker in exec_c:
                  idx = exec_c.index(marker)
                  # Find the opening brace and "return __do_execve_file"
                  rest = exec_c[idx:]
                  ret_marker = "return __do_execve_file("
                  ret_idx = rest.index(ret_marker)
                  insert_pos = idx + ret_idx
                  exec_c = exec_c[:insert_pos] + exec_hook + "\n" + exec_c[insert_pos:]
              else:
                  print("WARNING: Could not find do_execveat_common in exec.c")

              # Add declaration before do_execveat_common
              if "extern int ksu_handle_execveat" not in exec_c:
                  marker2 = "static int do_execveat_common("
                  if marker2 in exec_c:
                      idx2 = exec_c.index(marker2)
                      exec_c = exec_c[:idx2] + exec_declare + exec_c[idx2:]

          write_file("fs/exec.c", exec_c)
          print("  fs/exec.c patched OK")

          # ===== 3. fs/open.c (kernel 4.19+ pattern) =====
          print("Patching fs/open.c...")
          open_c = read_file("fs/open.c")

          open_declare = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  __attribute__((hot))
  extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
  				int *mode, int *flags);
  #endif

  """

          open_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
  #endif
  """

          if "ksu_handle_faccessat" not in open_c:
              # Find SYSCALL_DEFINE3(faccessat and add hook after opening brace
              marker = "SYSCALL_DEFINE3(faccessat,"
              if marker in open_c:
                  idx = open_c.index(marker)
                  rest = open_c[idx:]
                  # Find the opening brace
                  brace_idx = rest.index("{")
                  # Find the first statement after the brace
                  after_brace = rest[brace_idx+1:brace_idx+200]
                  # Add hook right after the opening brace line
                  brace_end = open_c.index("{", idx) + 1
                  open_c = open_c[:brace_end] + open_hook + open_c[brace_end:]

                  # Add declaration before the SYSCALL
                  open_c = open_c[:idx] + open_declare + open_c[idx:]
              else:
                  print("WARNING: Could not find SYSCALL_DEFINE3(faccessat in open.c")

          write_file("fs/open.c", open_c)
          print("  fs/open.c patched OK")

          # ===== 4. kernel/reboot.c (kernel 3.11+ pattern) =====
          print("Patching kernel/reboot.c...")
          reboot_c = read_file("kernel/reboot.c")

          reboot_declare = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
  #endif

  """

          reboot_hook = """
  #ifdef CONFIG_KSU_MANUAL_HOOK
  	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
  #endif
  """

          if "ksu_handle_sys_reboot" not in reboot_c:
              marker = "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,"
              if marker in reboot_c:
                  idx = reboot_c.index(marker)
                  rest = reboot_c[idx:]
                  # Find "int ret = 0;"
                  ret_idx = rest.index("int ret = 0;")
                  insert_pos = idx + ret_idx + len("int ret = 0;")
                  reboot_c = reboot_c[:insert_pos] + reboot_hook + reboot_c[insert_pos:]

                  # Add declaration before the SYSCALL
                  reboot_c = reboot_c[:idx] + reboot_declare + reboot_c[idx:]
              else:
                  print("WARNING: Could not find SYSCALL_DEFINE4(reboot in kernel/reboot.c")

          write_file("kernel/reboot.c", reboot_c)
          print("  kernel/reboot.c patched OK")

          print("\nAll manual hooks applied successfully!")
          PYEOF

      - name: Configure kernel
        run: |
          cd kernel
          echo "=== Available configs ==="
          ls arch/arm64/configs/
          ls arch/arm64/configs/vendor/ | grep -i holi
          
          make ARCH=arm64 LLVM=1 O=out defconfig
          
          cat arch/arm64/configs/vendor/holi_QGKI.config >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          echo "CONFIG_LOCALVERSION=-ReSukiSU-veux" >> out/.config
          
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          
          echo "=== KSU config ==="
          grep "CONFIG_KSU" out/.config || echo "WARNING: KSU not in config"

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 O=out -j$(nproc) 2>&1 | tail -100

      - name: Check output
        if: always()
        run: |
          ls -la kernel/out/arch/arm64/boot/Image* 2>/dev/null || echo "Image NOT found"

      - name: Package AnyKernel3
        if: always()
        run: |
          test -f kernel/out/arch/arm64/boot/Image || exit 1
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.zip
          cp ../kernel/out/arch/arm64/boot/Image Image
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU-veux/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../ReSukiSU-veux.zip . -x ".git*"

      - name: Upload artifact
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kernel-veux
          path: ReSukiSU-veux.zip
          retention-days: 7

      - name: Create Release
        if: hashFiles('ReSukiSU-veux.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ReSukiSU-veux.zip
          tag_name: v1.0
          name: ReSukiSU Kernel for veux
          body: |
            ReSukiSU kernel for Redmi Note 11 Pro+ 5G (veux/SM6375)
            - crDroid 14.0 kernel base (5.4.280)
            - KernelSU root + SUSFS
            - Pure LLVM build
            
            Flash: Extract boot.img, `fastboot flash boot boot.img`
            Recovery: `fastboot flash boot stock_boot.img`
          make_latest: true
