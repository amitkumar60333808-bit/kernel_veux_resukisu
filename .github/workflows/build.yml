name: Build ReSukiSU Kernel for veux (SM6375)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build ReSukiSU Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_sm6375.git kernel

      - name: Setup ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Configure kernel
        working-directory: kernel
        run: |
          # Create merged defconfig
          cat defconfig vendor/holi_QGKI.config > .config_fragment
          echo "CONFIG_KSU=y" >> .config_fragment
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> .config_fragment
          echo "CONFIG_LOCALVERSION=-ReSukiSU-veux" >> .config_fragment
          
          # Show what defconfig files exist
          echo "=== Available defconfigs ==="
          ls arch/arm64/configs/
          ls arch/arm64/configs/vendor/ | grep -i holi
          
          # Try to build the defconfig
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out defconfig 2>&1 | tail -5
          
          # Merge our config fragment
          scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/defconfig arch/arm64/configs/vendor/holi_QGKI.config .config_fragment 2>&1 | tail -10
          
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out olddefconfig 2>&1 | tail -5

      - name: Build kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out -j$(nproc) 2>&1 | tail -50

      - name: Check output
        working-directory: kernel
        run: |
          ls -la out/arch/arm64/boot/Image 2>/dev/null || echo "Image not found!"
          ls -la out/arch/arm64/boot/ 2>/dev/null | head -20

      - name: Package AnyKernel3
        if: success()
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ../AnyKernel3
          cd ../AnyKernel3
          rm -f *.zip
          cp ../kernel/out/arch/arm64/boot/Image Image
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU-veux/' anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=veux/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=peux/' anykernel.sh
          zip -r9 ../ReSukiSU-veux-$(date +%Y%m%d).zip . -x ".git*"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-kernel-veux
          path: "ReSukiSU-veux-*.zip"
          retention-days: 7

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: "ReSukiSU-veux-*.zip"
          tag_name: "v1.0-$(date +%Y%m%d)"
          name: "ReSukiSU Kernel for veux"
          body: |
            ReSukiSU kernel for Redmi Note 11 Pro+ 5G (veux/SM6375)
            - crDroid 14.0 kernel base
            - KernelSU root with SUSFS
            - Manual hooks for non-GKI 5.4
            
            Flash: Extract boot.img, fastboot flash boot boot.img
            Recovery: fastboot flash boot stock_boot.img
          make_latest: true
